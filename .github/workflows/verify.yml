name: Verify template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned package manager and dependencies
        run: |
          npm install -g pnpm@12.16.1 --no-audit --no-fund
          pnpm install --frozen-lockfile
      - name: Test importer and frontend helpers
        run: pnpm test
      - name: Test fictional demo and feed protocol
        run: |
          node --test tests/demo.test.mjs
          python3 -m unittest discover -s tests -p 'feed*_test.py' -v
      - name: Generate fictional demo
        run: pnpm demo
      - name: Typecheck and build
        run: |
          pnpm typecheck
          pnpm build
